<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Alik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video id="video" autoplay></video>

    <div id="status" class="status" hidden></div>

    <aside id="osd" class="osd" hidden>
        <span id="osd-number" class="osd-number"></span>
        <div>
            <p id="osd-name" class="osd-name"></p>
            <p id="osd-group" class="osd-group"></p>
        </div>
    </aside>

    <div id="digits" class="digits" hidden></div>

    <nav id="menu" class="menu" hidden>
        <header class="menu-head">
            <span class="brand">Alik</span>
            <time id="clock"></time>
        </header>
        <div class="columns">
            <ul id="groups" class="groups"></ul>
            <ul id="channels" class="channels"></ul>
        </div>
        <footer class="menu-hint">OK — смотреть · ←→ — группы и каналы · Green — плейлисты · Back — закрыть</footer>
    </nav>

    <section id="sources" class="sources" hidden>
        <h1 class="brand">Alik</h1>
        <h2>Плейлисты</h2>
        <p class="sources-intro">Вставьте ссылку на M3U-плейлист. Длинную ссылку удобно вставить с телефона: клавиатура в приложении LG ThinQ.</p>
        <ul id="source-list" class="source-list">
            <li id="source-field" class="field">
                <input id="source-url" type="url" placeholder="https://example.com/playlist.m3u" spellcheck="false" autocomplete="off">
            </li>
        </ul>
        <p class="catalog-intro">Каталог iptv-org: выберите страну и нажмите OK. Back — назад.</p>
        <ul id="catalog-list" class="catalog-list"></ul>
        <p id="source-notice" class="sources-notice" aria-live="polite"></p>
    </section>

    <script src="vendor/hls.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
